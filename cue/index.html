<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Insights Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root {
  --bg:#0a0a0f; --surface:#111118; --surface2:#1a1a24; --border:#2a2a3a;
  --yt:#ff0000; --yt-glow:rgba(255,0,0,0.12); --tw:#1d9bf0; --tw-glow:rgba(29,155,240,0.12);
  --rd:#ff4500; --rd-glow:rgba(255,69,0,0.12);
  --accent:#f0e040; --text:#e8e8f0; --muted:#888899; --active:#ff0000;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden;}

header{padding:0 2rem;height:54px;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--border);background:var(--surface);}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;}
.brand em{color:var(--accent);font-style:normal;}
.tabs{margin-left:auto;display:flex;height:100%;}
.tab-btn{height:100%;padding:0 1.6rem;border:none;background:transparent;cursor:pointer;
  font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:.04em;
  color:var(--muted);border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:.45rem;}
.tab-btn:hover{color:var(--text);}
.tab-btn.yt.active{color:var(--yt);border-bottom-color:var(--yt);background:var(--yt-glow);}
.tab-btn.tw.active{color:var(--tw);border-bottom-color:var(--tw);background:var(--tw-glow);}
.tab-btn.rd.active{color:var(--rd);border-bottom-color:var(--rd);background:var(--rd-glow);}

/* ── FOLDER SELECTOR BAR ── */
.folder-bar{display:flex;align-items:center;gap:.6rem;padding:.5rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;}
.folder-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;}
.folder-chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .65rem;background:var(--surface);border:1px solid var(--border);border-radius:3px;font-size:.7rem;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'DM Mono',monospace;}
.folder-chip:hover{border-color:var(--text);color:var(--text);}
.folder-chip.active-folder{border-color:var(--accent);color:var(--accent);background:rgba(240,224,64,.07);}
.folder-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;}
.custom-folder-wrap{display:flex;align-items:center;gap:.4rem;}
.custom-folder-input{background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'DM Mono',monospace;font-size:.68rem;padding:.2rem .5rem;outline:none;width:160px;transition:border-color .15s;}
.custom-folder-input:focus{border-color:var(--accent);}
.custom-folder-btn{padding:.2rem .6rem;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.68rem;cursor:pointer;transition:all .15s;white-space:nowrap;}
.custom-folder-btn:hover{border-color:var(--accent);color:var(--accent);}

.toolbar{display:flex;align-items:center;gap:.5rem;padding:.65rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;}
.toolbar-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:.2rem;}
.col-pill{display:inline-flex;align-items:center;gap:.25rem;padding:.22rem .55rem;background:var(--surface2);border:1px solid var(--border);border-radius:3px;font-size:.68rem;color:var(--text);cursor:grab;user-select:none;transition:all .12s;white-space:nowrap;}
.col-pill:hover{border-color:var(--active);color:var(--active);}
.col-pill.dragging{opacity:.3;transform:scale(.95);}
.col-pill.drag-over{border-color:var(--accent);background:rgba(240,224,64,.1);}
.drag-handle{color:var(--muted);font-size:.65rem;}
.reset-btn{margin-left:auto;padding:.22rem .7rem;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.68rem;cursor:pointer;transition:all .15s;white-space:nowrap;}
.reset-btn:hover{border-color:var(--text);color:var(--text);}

.statusbar{padding:.3rem 1.5rem;font-size:.68rem;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1.5rem;}
.statusbar span{color:var(--text);}
.clear-btn{background:transparent;border:1px solid var(--border);border-radius:2px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.65rem;padding:.1rem .4rem;cursor:pointer;margin-left:auto;}
.clear-btn:hover{border-color:var(--yt);color:var(--yt);}

.table-container{overflow:auto;flex:1;}
table{width:max-content;min-width:100%;border-collapse:collapse;table-layout:fixed;}
thead{position:sticky;top:0;z-index:10;}
th{background:var(--surface);padding:.5rem .8rem;text-align:left;font-family:'Syne',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;position:relative;overflow:visible;}
th:last-child{border-right:none;}
.th-inner{display:flex;flex-direction:column;gap:.3rem;}
.th-label{display:flex;align-items:center;gap:.35rem;}
.sort-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.7rem;padding:0;display:flex;gap:1px;line-height:1;}
.sort-btn:hover{color:var(--text);}
.sort-btn.asc .u{color:var(--accent);}
.sort-btn.desc .d{color:var(--accent);}
.filter-input,.filter-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:'DM Mono',monospace;font-size:.65rem;padding:.18rem .35rem;outline:none;transition:border-color .15s;}
.filter-input:focus,.filter-select:focus{border-color:var(--active);}
.filter-select{cursor:pointer;}
.filter-select option{background:var(--surface);}
td{padding:.42rem .8rem;font-size:.72rem;border-bottom:1px solid var(--border);border-right:1px solid rgba(42,42,58,.4);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;}
td:last-child{border-right:none;}
tr:hover td{background:var(--surface2);}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--accent);}
.badge{display:inline-block;padding:.08rem .4rem;border-radius:2px;font-size:.66rem;background:var(--surface2);border:1px solid var(--border);}
.sev-low{border-color:#4ade80;color:#4ade80;}
.sev-med{border-color:#facc15;color:#facc15;}
.sev-high{border-color:#f87171;color:#f87171;}
.link-cell{color:var(--tw);text-decoration:none;}
.link-cell:hover{text-decoration:underline;}
.empty{text-align:center;padding:4rem;color:var(--muted);font-size:.8rem;}
.empty .big{font-family:'Syne',sans-serif;font-size:3rem;color:var(--border);display:block;margin-bottom:.5rem;}
.panel{display:none;flex-direction:column;height:calc(100vh - 54px);overflow:hidden;}
.panel.active{display:flex;}
.loading{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.8rem;color:var(--muted);font-size:.8rem;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--active);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

/* ── COLUMN RESIZE ── */
.col-resizer{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:20;background:transparent;transition:background .15s;}
.col-resizer:hover,.col-resizer.active{background:var(--accent);}

/* ── TEXT EXPAND MODAL ── */
.text-expand-cell{cursor:pointer;}
.text-expand-cell:hover{color:var(--accent);}
.text-expand-cell::after{content:'↗';font-size:.6rem;opacity:.4;margin-left:.3rem;vertical-align:super;}

#text-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;}
#text-modal-backdrop.open{display:flex;}
#text-modal{background:var(--surface);border:1px solid var(--border);border-radius:6px;max-width:640px;width:100%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.6);}
#text-modal-header{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
#text-modal-col{font-family:'Syne',sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;}
#text-modal-close{background:none;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.75rem;padding:.15rem .5rem;cursor:pointer;transition:all .15s;}
#text-modal-close:hover{border-color:var(--text);color:var(--text);}
#text-modal-body{padding:1rem;overflow-y:auto;font-size:.82rem;line-height:1.7;color:var(--text);word-break:break-word;
  /* KEY FIX: preserve newlines and whitespace */
  white-space:pre-wrap;}

/* ── GRAPH MODAL ── */
.graph-btn{background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.68rem;padding:.15rem .55rem;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:.3rem;}
.graph-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(240,224,64,.06);}
#graph-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1100;backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:1.5rem;}
#graph-modal-backdrop.open{display:flex;}
#graph-modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:min(95vw,1200px);height:min(88vh,780px);display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.7);overflow:hidden;}
#graph-modal-header{padding:.8rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#graph-modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.02em;color:var(--text);}
#graph-modal-subtitle{font-size:.7rem;color:var(--muted);margin-left:.6rem;}
#graph-modal-close{background:none;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.75rem;padding:.2rem .6rem;cursor:pointer;transition:all .15s;}
#graph-modal-close:hover{border-color:var(--text);color:var(--text);}
#graph-modal-body{flex:1;padding:1.2rem;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
#graph-canvas{width:100%;height:100%;}
</style>
</head>
<body>

<!-- Text expand modal -->
<div id="text-modal-backdrop" role="dialog" aria-modal="true">
  <div id="text-modal">
    <div id="text-modal-header">
      <span id="text-modal-col"></span>
      <button id="text-modal-close" onclick="closeTextModal()">✕ close</button>
    </div>
    <div id="text-modal-body"></div>
  </div>
</div>

<!-- Graph modal -->
<div id="graph-modal-backdrop" role="dialog" aria-modal="true">
  <div id="graph-modal">
    <div id="graph-modal-header">
      <div style="display:flex;align-items:baseline;">
        <span id="graph-modal-title">Date Distribution</span>
        <span id="graph-modal-subtitle"></span>
      </div>
      <button id="graph-modal-close" onclick="closeGraphModal()">✕ close</button>
    </div>
    <div id="graph-modal-body">
      <canvas id="graph-canvas"></canvas>
    </div>
  </div>
</div>

<header>
  <div class="brand">insights<em>_</em>explorer</div>
  <div class="tabs">
    <button class="tab-btn yt active" onclick="switchTab('yt')">▶ &nbsp;YouTube <span id="yt-count" style="font-size:.62rem;opacity:.5;margin-left:.2rem;"></span></button>
    <button class="tab-btn tw" onclick="switchTab('tw')">✦ &nbsp;Twitter <span id="tw-count" style="font-size:.62rem;opacity:.5;margin-left:.2rem;"></span></button>
    <button class="tab-btn rd" onclick="switchTab('rd')">👾 &nbsp;Reddit <span id="rd-count" style="font-size:.62rem;opacity:.5;margin-left:.2rem;"></span></button>
  </div>
</header>

<!-- Folder selector (rendered by JS) -->
<div id="folder-bar" class="folder-bar"></div>

<div id="panel-yt" class="panel active">
  <div class="loading" id="load-yt"><div class="spinner"></div><span id="load-yt-msg">Loading youtube.csv …</span></div>
  <div id="box-yt" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="toolbar" id="toolbar-yt"></div>
    <div class="statusbar" id="status-yt"></div>
    <div class="table-container"><table id="table-yt"><thead id="thead-yt"></thead><tbody id="tbody-yt"></tbody></table></div>
  </div>
</div>
<div id="panel-tw" class="panel">
  <div class="loading" id="load-tw"><div class="spinner"></div><span id="load-tw-msg">Loading twitter.csv …</span></div>
  <div id="box-tw" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="toolbar" id="toolbar-tw"></div>
    <div class="statusbar" id="status-tw"></div>
    <div class="table-container"><table id="table-tw"><thead id="thead-tw"></thead><tbody id="tbody-tw"></tbody></table></div>
  </div>
</div>
<div id="panel-rd" class="panel">
  <div class="loading" id="load-rd"><div class="spinner"></div><span id="load-rd-msg">Loading reddit.csv …</span></div>
  <div id="box-rd" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="toolbar" id="toolbar-rd"></div>
    <div class="statusbar" id="status-rd"></div>
    <div class="table-container"><table id="table-rd"><thead id="thead-rd"></thead><tbody id="tbody-rd"></tbody></table></div>
  </div>
</div>

<script>
// ── FOLDER CONFIG ────────────────────────────────────────────
// Add known folders here. '' = same directory as index.html.
// Each entry: { id, label, path }
// path should end with '/' if non-empty, or be '' for root.
const KNOWN_FOLDERS = [
  { id: 'root',         label: 'root (./)'},
  { id: 'icici_lombard', label: 'icici_lombard' },
  // Add more known folders below — they'll show as chips:
  // { id: 'hdfc_ergo',  label: 'hdfc_ergo' },
  // { id: 'bajaj',      label: 'bajaj' },
];

// Files per tab within a folder
const FILE_NAMES = { yt: 'youtube.csv', tw: 'twitter.csv', rd: 'reddit.csv' };

// Active folder state (persisted)
let activeFolder = (() => {
  try { return localStorage.getItem('active_folder') || 'icici_lombard'; } catch(e){ return 'icici_lombard'; }
})();

function folderPath(folderId) {
  if (!folderId || folderId === 'root') return '';
  return folderId + '/';
}

function filePath(folderId, tabId) {
  return folderPath(folderId) + FILE_NAMES[tabId];
}

// ── FOLDER BAR ───────────────────────────────────────────────
function buildFolderBar() {
  const bar = document.getElementById('folder-bar');
  bar.innerHTML = '<span class="folder-label">📁 Folder</span>';

  KNOWN_FOLDERS.forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'folder-chip' + (activeFolder === f.id ? ' active-folder' : '');
    chip.innerHTML = '<span class="folder-dot"></span>' + f.label;
    chip.title = folderPath(f.id) || './';
    chip.onclick = () => switchFolder(f.id);
    bar.appendChild(chip);
  });

  // Custom folder input
  const wrap = document.createElement('div');
  wrap.className = 'custom-folder-wrap';
  wrap.innerHTML =
    '<input class="custom-folder-input" id="custom-folder-input" placeholder="other/folder/path…" title="Type a folder path and press Load">' +
    '<button class="custom-folder-btn" onclick="loadCustomFolder()">Load</button>';
  bar.appendChild(wrap);
}

function switchFolder(folderId) {
  activeFolder = folderId;
  try { localStorage.setItem('active_folder', folderId); } catch(e){}
  buildFolderBar();
  // Reset all tabs so they reload from new folder
  ['yt','tw','rd'].forEach(id => {
    S[id].loaded = false;
    S[id].allRows = [];
    S[id].columns = [];
    S[id].origCols = [];
    S[id].colTypes = {};
    S[id].sortCol = null;
    S[id].sortDir = 'asc';
    S[id].filters = {};
    // Reset UI
    document.getElementById('box-'+id).style.display = 'none';
    document.getElementById('load-'+id).style.display = 'flex';
    document.getElementById('load-'+id).querySelector('.spinner').style.display = '';
    document.getElementById('load-'+id+'-msg').textContent = 'Loading ' + FILE_NAMES[id] + '…';
    document.getElementById(id+'-count').textContent = '';
  });
  // Reload currently visible tab
  const activeTab = document.querySelector('.tab-btn.active');
  const tabId = activeTab ? [...activeTab.classList].find(c=>['yt','tw','rd'].includes(c)) : 'yt';
  loadData(tabId);
}

function loadCustomFolder() {
  const inp = document.getElementById('custom-folder-input');
  let val = (inp.value || '').trim().replace(/\/+$/, ''); // strip trailing slash
  if (!val) return;
  // Check if already in list
  const existing = KNOWN_FOLDERS.find(f => f.id === val);
  if (!existing) {
    KNOWN_FOLDERS.push({ id: val, label: val });
  }
  inp.value = '';
  switchFolder(val);
}

// ── CONFIG ──────────────────────────────────────────────────
const NO_SORT_COLS = new Set(['original_text']);

function detectColType(rows, col) {
  const vals = rows.map(r => r[col]).filter(v => v !== undefined && v !== '');
  if (!vals.length) return 'text';
  const numCount = vals.filter(v => !isNaN(Number(v)) && v.trim() !== '').length;
  if (numCount / vals.length >= 0.8) return 'numeric';
  const dateCount = vals.filter(v => {
    const d = new Date(v);
    return !isNaN(d.getTime()) && /\d{4}/.test(v);
  }).length;
  if (dateCount / vals.length >= 0.7) return 'datetime';
  return 'text';
}

function getFreqSortedUniq(rows, col) {
  const freq = {};
  rows.forEach(r => {
    const v = r[col];
    if (v !== undefined && v !== '') freq[v] = (freq[v] || 0) + 1;
  });
  return Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .map(([v]) => v);
}

// ── COOKIE / LOCALSTORAGE ───────────────────────────────────
function saveCols(id, cols) {
  const v = cols.join(',');
  try { localStorage.setItem('col_'+id, v); } catch(e){}
  document.cookie = `col_${id}=${encodeURIComponent(v)};path=/;max-age=31536000`;
}
function loadSavedCols(id, headers) {
  let v = null;
  try { v = localStorage.getItem('col_'+id); } catch(e){}
  if (!v) {
    const m = document.cookie.split(';').find(c=>c.trim().startsWith('col_'+id+'='));
    if (m) v = decodeURIComponent(m.split('=')[1]);
  }
  if (!v) return [...headers];
  const saved = v.split(',');
  return (saved.length === headers.length && saved.every(c=>headers.includes(c))) ? saved : [...headers];
}
function saveColWidths(id, widths) {
  try { localStorage.setItem('colw_'+id, JSON.stringify(widths)); } catch(e){}
}
function loadColWidths(id) {
  try { const v = localStorage.getItem('colw_'+id); return v ? JSON.parse(v) : {}; } catch(e){ return {}; }
}

// ── STATE ───────────────────────────────────────────────────
const S = {};
['yt','tw','rd'].forEach(id => {
  S[id] = { allRows:[], columns:[], origCols:[], colTypes:{}, sortCol:null, sortDir:'asc', filters:{}, loaded:false, colWidths:{} };
});

// ── DRAG STATE ──────────────────────────────────────────────
let dragSrc = null;

// ── TEXT MODAL ──────────────────────────────────────────────
function openTextModal(colName, text) {
  document.getElementById('text-modal-col').textContent = colName.replace(/_/g,' ');
  // Use textContent so newlines in the string are preserved by white-space:pre-wrap
  document.getElementById('text-modal-body').textContent = text;
  document.getElementById('text-modal-backdrop').classList.add('open');
}
function closeTextModal() {
  document.getElementById('text-modal-backdrop').classList.remove('open');
}
document.getElementById('text-modal-backdrop').addEventListener('click', function(e) {
  if (e.target === this) closeTextModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTextModal(); });

// ── TAB SWITCH ──────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab-btn.'+id).classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
  document.documentElement.style.setProperty('--active', id==='yt'?'var(--yt)':id==='tw'?'var(--tw)':'var(--rd)');
  if (!S[id].loaded) loadData(id);
}

// ── COLUMN RESIZE ────────────────────────────────────────────
function attachResizer(th, id, col) {
  const resizer = document.createElement('div');
  resizer.className = 'col-resizer';
  th.appendChild(resizer);
  let startX, startW;
  function onMouseMove(e) {
    const dx = (e.clientX || (e.touches && e.touches[0].clientX) || 0) - startX;
    const newW = Math.max(60, startW + dx);
    th.style.width = newW + 'px';
    th.style.minWidth = newW + 'px';
    S[id].colWidths[col] = newW;
  }
  function onMouseUp() {
    resizer.classList.remove('active');
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    document.removeEventListener('touchmove', onMouseMove);
    document.removeEventListener('touchend', onMouseUp);
    saveColWidths(id, S[id].colWidths);
  }
  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    resizer.classList.add('active');
    startX = e.clientX; startW = th.offsetWidth;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });
  resizer.addEventListener('touchstart', e => {
    e.preventDefault();
    resizer.classList.add('active');
    startX = e.touches[0].clientX; startW = th.offsetWidth;
    document.addEventListener('touchmove', onMouseMove, {passive:false});
    document.addEventListener('touchend', onMouseUp);
  }, {passive:false});
}

// ── LOAD DATA (PapaParse) ────────────────────────────────────
function loadData(id) {
  // Show loading state
  document.getElementById('box-'+id).style.display = 'none';
  const loadEl = document.getElementById('load-'+id);
  loadEl.style.display = 'flex';
  loadEl.querySelector('.spinner').style.display = '';
  const path = filePath(activeFolder, id);
  document.getElementById('load-'+id+'-msg').textContent = 'Loading ' + path + ' …';

  Papa.parse(path, {
    download: true,
    header: true,
    skipEmptyLines: true,
    transformHeader: h => h.trim(),
    // KEY FIX: do NOT strip newlines from values — just trim leading/trailing whitespace
    // but preserve internal newlines so the modal can show them.
    transform: val => val.trim(),
    complete(results) {
      const headers = results.meta.fields;
      const rows    = results.data;

      S[id].allRows  = rows;
      S[id].origCols = [...headers];
      S[id].columns  = loadSavedCols(id, headers);
      S[id].colWidths = loadColWidths(id);
      S[id].loaded   = true;

      headers.forEach(col => {
        S[id].colTypes[col] = NO_SORT_COLS.has(col) ? 'nosort' : detectColType(rows, col);
      });

      loadEl.style.display = 'none';
      const box = document.getElementById('box-'+id);
      box.style.display = 'flex';
      document.getElementById(id+'-count').textContent = rows.length;

      buildToolbar(id);
      renderTable(id);
    },
    error(err) {
      loadEl.querySelector('.spinner').style.display = 'none';
      loadEl.innerHTML =
        '<div style="color:#f87171;text-align:center;line-height:2">⚠ Could not load <b>' + path + '</b><br>' +
        '<span style="color:var(--muted);font-size:.72rem;">Make sure the CSV exists at that path relative to index.html.<br>' + err.message + '</span></div>';
    }
  });
}

// ── TOOLBAR ─────────────────────────────────────────────────
function buildToolbar(id) {
  const bar = document.getElementById('toolbar-'+id);
  bar.innerHTML = '<span class="toolbar-label">Columns</span>';

  S[id].columns.forEach(col => {
    const pill = document.createElement('div');
    pill.className = 'col-pill';
    pill.draggable = true;
    pill.dataset.col = col;
    pill.innerHTML = '<span class="drag-handle">⠿</span>'+col.replace(/_/g,' ');

    pill.addEventListener('dragstart', e => {
      dragSrc = pill; pill.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
    });
    pill.addEventListener('dragend', () => {
      pill.classList.remove('dragging');
      bar.querySelectorAll('.col-pill').forEach(p=>p.classList.remove('drag-over'));
    });
    pill.addEventListener('dragover', e => { e.preventDefault(); if(pill!==dragSrc) pill.classList.add('drag-over'); });
    pill.addEventListener('dragleave', () => pill.classList.remove('drag-over'));
    pill.addEventListener('drop', e => {
      e.preventDefault();
      if (!dragSrc || dragSrc===pill) return;
      const cols = S[id].columns;
      const fi = cols.indexOf(dragSrc.dataset.col), ti = cols.indexOf(pill.dataset.col);
      cols.splice(fi,1); cols.splice(ti,0,dragSrc.dataset.col);
      saveCols(id, cols); buildToolbar(id); renderTable(id);
    });
    bar.appendChild(pill);
  });

  const rst = document.createElement('button');
  rst.className='reset-btn'; rst.textContent='↺ Reset order';
  rst.onclick = () => { S[id].columns=[...S[id].origCols]; saveCols(id,S[id].columns); buildToolbar(id); renderTable(id); };
  bar.appendChild(rst);
}

// ── RENDER TABLE ────────────────────────────────────────────
function clearFilters(id) { S[id].filters={}; renderTable(id); }

function renderTable(id) {
  const s = S[id], cols = s.columns;

  const freqUniq = {};
  cols.forEach(col => {
    if (s.colTypes[col] === 'text')
      freqUniq[col] = getFreqSortedUniq(s.allRows, col);
  });

  let rows = s.allRows.filter(row => cols.every(col => {
    const fv = s.filters[col];
    if (!fv || fv === '__ALL__') return true;
    const type = s.colTypes[col];
    if (type === 'numeric') return String(row[col]) === fv;
    return row[col] === fv;
  }));

  if (s.sortCol) {
    const col = s.sortCol, dir = s.sortDir === 'asc' ? 1 : -1;
    const type = s.colTypes[col];
    rows = [...rows].sort((a, b) => {
      if (type === 'numeric') return (parseFloat(a[col]||0) - parseFloat(b[col]||0)) * dir;
      if (type === 'datetime') return (new Date(a[col]||0) - new Date(b[col]||0)) * dir;
      return String(a[col]||'').localeCompare(String(b[col]||'')) * dir;
    });
  }

  const af = Object.entries(s.filters).filter(([,v])=>v&&v!=='__ALL__');
  document.getElementById('status-'+id).innerHTML =
    'Showing <span>'+rows.length+'</span> of <span>'+s.allRows.length+'</span> rows' +
    (af.length?' &middot; <span>'+af.length+'</span> filter'+(af.length>1?'s':'')+' active':'') +
    (s.sortCol?' &middot; sorted by <span>'+s.sortCol+'</span> ('+s.sortDir+')':'') +
    (af.length?' <button class="clear-btn" onclick="clearFilters(\''+id+'\')">✕ clear all</button>':'');

  const thead = document.getElementById('thead-'+id);
  thead.innerHTML = '';
  const tr = document.createElement('tr');

  cols.forEach(col => {
    const type = s.colTypes[col];
    const th = document.createElement('th');

    const savedW = s.colWidths[col];
    const defaultW = (col === 'original_text' || col === 'summary_insight') ? 260
                   : (type === 'numeric') ? 120
                   : (type === 'datetime') ? 160
                   : 150;
    const w = savedW || defaultW;
    th.style.width = w + 'px';
    th.style.minWidth = w + 'px';

    const inner = document.createElement('div'); inner.className = 'th-inner';
    const lbl = document.createElement('div'); lbl.className = 'th-label';
    lbl.textContent = col.replace(/_/g,' ');

    if (type !== 'nosort') {
      const sb = document.createElement('button');
      sb.className = 'sort-btn' + (s.sortCol===col ? (s.sortDir==='asc'?' asc':' desc') : '');
      sb.innerHTML = '<span class="u">▲</span><span class="d">▼</span>';
      sb.title = 'Sort';
      sb.onclick = () => {
        s.sortDir = (s.sortCol === col && s.sortDir === 'asc') ? 'desc' : 'asc';
        s.sortCol = col;
        renderTable(id);
      };
      lbl.appendChild(sb);
    }
    inner.appendChild(lbl);

    if (type === 'numeric') {
      const inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any';
      inp.className = 'filter-input'; inp.placeholder = 'exact…';
      inp.value = s.filters[col] && s.filters[col] !== '__ALL__' ? s.filters[col] : '';
      inp.oninput = () => { s.filters[col] = inp.value || '__ALL__'; renderTable(id); };
      inner.appendChild(inp);
    } else if (type === 'nosort') {
      // no filter
    } else if (type === 'datetime') {
      const vals = [...new Set(s.allRows.map(r=>r[col]).filter(v=>v!==undefined&&v!==''))]
        .sort((a,b) => new Date(a) - new Date(b));
      const sel = document.createElement('select'); sel.className = 'filter-select';
      sel.appendChild(new Option('— all —','__ALL__'));
      vals.forEach(v => { const o = new Option(v.length>28?v.slice(0,26)+'…':v, v); o.title=v; sel.appendChild(o); });
      sel.value = s.filters[col] || '__ALL__';
      sel.onchange = () => { s.filters[col] = sel.value; renderTable(id); };
      inner.appendChild(sel);
    } else {
      const sel = document.createElement('select'); sel.className = 'filter-select';
      sel.appendChild(new Option('— all —','__ALL__'));
      (freqUniq[col] || []).forEach(v => {
        const o = new Option(v.length>30?v.slice(0,28)+'…':v, v); o.title=v; sel.appendChild(o);
      });
      sel.value = s.filters[col] || '__ALL__';
      sel.onchange = () => { s.filters[col] = sel.value; renderTable(id); };
      inner.appendChild(sel);
    }

    th.appendChild(inner);
    attachResizer(th, id, col);
    tr.appendChild(th);
  });
  thead.appendChild(tr);

  const tbody = document.getElementById('tbody-'+id);
  tbody.innerHTML = '';
  if (!rows.length) {
    const r = document.createElement('tr'), td = document.createElement('td');
    td.colSpan = cols.length;
    td.innerHTML = '<div class="empty"><span class="big">∅</span>No rows match the current filters.</div>';
    r.appendChild(td); tbody.appendChild(r); return;
  }

  const frag = document.createDocumentFragment();
  rows.forEach(row => {
    const tr = document.createElement('tr');
    cols.forEach(col => {
      const td = document.createElement('td');
      const val = row[col] ?? '';
      const type = s.colTypes[col];

      if (type === 'numeric') {
        td.className = 'num'; td.textContent = val; td.title = val;

      } else if (col === 'emotion_severity') {
        const b = document.createElement('span');
        const v = String(val).toLowerCase();
        b.className = 'badge '+(v==='low'?'sev-low':v==='high'?'sev-high':v==='medium'?'sev-med':'');
        b.textContent = val; td.appendChild(b);

      } else if (col === 'link') {
        const a = document.createElement('a'); a.href = val; a.target = '_blank'; a.rel = 'noopener';
        a.className = 'link-cell'; a.textContent = val.length>38?val.slice(0,36)+'…':val; a.title = val;
        td.appendChild(a);

      } else if (col === 'original_text' || col === 'summary_insight') {
        td.className = 'text-expand-cell';
        // For the cell preview: collapse newlines to spaces so the row stays single-line
        const preview = val.replace(/\r\n|\r|\n/g, ' ');
        td.textContent = preview.length > 60 ? preview.slice(0, 58) + '…' : preview;
        td.title = 'Click to read full text';
        // Modal gets the raw value with all original newlines intact
        td.addEventListener('click', () => openTextModal(col, val));

      } else {
        const b = document.createElement('span'); b.className = 'badge'; b.textContent = val; b.title = val;
        td.appendChild(b);
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

// ── GRAPH MODAL ─────────────────────────────────────────────
function getActiveTabId() {
  const activeBtn = document.querySelector('.tab-btn.active');
  if (!activeBtn) return 'yt';
  return [...activeBtn.classList].find(c => ['yt','tw','rd'].includes(c)) || 'yt';
}

function openGraphModal() {
  const id = getActiveTabId();
  const s = S[id];
  if (!s.loaded || !s.allRows.length) return;

  const tabNames = { yt: 'YouTube', tw: 'Twitter', rd: 'Reddit' };
  document.getElementById('graph-modal-title').textContent = 'Comment Date Distribution';
  document.getElementById('graph-modal-subtitle').textContent = '— ' + tabNames[id] + ' · ' + activeFolder + ' · ' + s.allRows.length + ' comments';
  document.getElementById('graph-modal-backdrop').classList.add('open');

  // Parse dates
  const dates = [];
  s.allRows.forEach(row => {
    const raw = row['date_time'] || row['Date'] || row['date'] || '';
    if (!raw) return;
    const d = new Date(raw);
    if (!isNaN(d.getTime())) dates.push(d);
  });

  if (!dates.length) {
    document.getElementById('graph-modal-body').innerHTML = '<div style="color:var(--muted);font-size:.85rem;">No valid dates found in this dataset.</div>';
    return;
  }

  // Ensure canvas is present
  const body = document.getElementById('graph-modal-body');
  if (!body.querySelector('#graph-canvas')) {
    body.innerHTML = '<canvas id="graph-canvas"></canvas>';
  }

  // Wait a frame for layout
  requestAnimationFrame(() => drawGraph(dates, id));
}

function closeGraphModal() {
  document.getElementById('graph-modal-backdrop').classList.remove('open');
}
document.getElementById('graph-modal-backdrop').addEventListener('click', function(e) {
  if (e.target === this) closeGraphModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGraphModal(); });

function drawGraph(dates, tabId) {
  const canvas = document.getElementById('graph-canvas');
  const container = document.getElementById('graph-modal-body');
  const dpr = window.devicePixelRatio || 1;
  const W = container.clientWidth;
  const H = container.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  // Colors per tab
  const colors = { yt: '#ff0000', tw: '#1d9bf0', rd: '#ff4500' };
  const barColor = colors[tabId] || '#f0e040';
  const barColorAlpha = barColor + 'cc';
  const glowColor = barColor + '33';

  // Margins
  const marginLeft = 80;
  const marginRight = 30;
  const marginTop = 30;
  const marginBottom = 90;
  const plotW = W - marginLeft - marginRight;
  const plotH = H - marginTop - marginBottom;

  // Find date range
  const minTime = Math.min(...dates.map(d => d.getTime()));
  const maxTime = Math.max(...dates.map(d => d.getTime()));
  const minDate = new Date(minTime);
  const maxDate = new Date(maxTime);

  // Build monthly buckets spanning the full range
  const startYear = minDate.getFullYear();
  const startMonth = minDate.getMonth();
  const endYear = maxDate.getFullYear();
  const endMonth = maxDate.getMonth();

  const buckets = []; // { year, month, count, timeStart, timeMid }
  let y = startYear, m = startMonth;
  while (y < endYear || (y === endYear && m <= endMonth)) {
    const tStart = new Date(y, m, 1).getTime();
    const nextM = m === 11 ? 0 : m + 1;
    const nextY = m === 11 ? y + 1 : y;
    const tEnd = new Date(nextY, nextM, 1).getTime();
    buckets.push({ year: y, month: m, count: 0, timeStart: tStart, timeMid: (tStart + tEnd) / 2, timeEnd: tEnd });
    m++;
    if (m > 11) { m = 0; y++; }
  }

  // Fill buckets
  dates.forEach(d => {
    const dy = d.getFullYear(), dm = d.getMonth();
    const b = buckets.find(b => b.year === dy && b.month === dm);
    if (b) b.count++;
  });

  const maxCount = Math.max(...buckets.map(b => b.count), 1);

  // LINEAR TIME AXIS: map absolute time to pixel position
  const timeMin = buckets[0].timeStart;
  const timeMax = buckets[buckets.length - 1].timeEnd;
  const timeRange = timeMax - timeMin || 1;

  function timeToX(t) {
    return marginLeft + ((t - timeMin) / timeRange) * plotW;
  }

  // Y axis: nice ticks
  function niceYTicks(max, desiredCount) {
    if (max <= 0) return [0];
    const rough = max / desiredCount;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const residual = rough / mag;
    let nice;
    if (residual <= 1.5) nice = 1;
    else if (residual <= 3) nice = 2;
    else if (residual <= 7) nice = 5;
    else nice = 10;
    const step = nice * mag;
    const ticks = [];
    for (let v = 0; v <= max + step * 0.1; v += step) {
      ticks.push(Math.round(v));
    }
    if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + Math.round(step));
    return ticks;
  }

  const yTicks = niceYTicks(maxCount, 6);
  const yMax = yTicks[yTicks.length - 1] || 1;

  function valToY(v) {
    return marginTop + plotH - (v / yMax) * plotH;
  }

  // ── Draw grid lines ──
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 0.5;
  yTicks.forEach(v => {
    const yy = valToY(v);
    ctx.beginPath();
    ctx.moveTo(marginLeft, yy);
    ctx.lineTo(W - marginRight, yy);
    ctx.stroke();
  });

  // ── Draw bars ──
  buckets.forEach(b => {
    const x1 = timeToX(b.timeStart);
    const x2 = timeToX(b.timeEnd);
    const barW = (x2 - x1) * 0.8;
    const barX = x1 + (x2 - x1 - barW) / 2;
    const barH = (b.count / yMax) * plotH;
    const barY = marginTop + plotH - barH;

    if (b.count > 0) {
      // Glow effect
      ctx.fillStyle = glowColor;
      ctx.fillRect(barX - 1, barY - 2, barW + 2, barH + 2);

      // Gradient bar
      const grad = ctx.createLinearGradient(barX, barY, barX, marginTop + plotH);
      grad.addColorStop(0, barColor);
      grad.addColorStop(1, barColor + '66');
      ctx.fillStyle = grad;

      // Rounded top corners
      const r = Math.min(3, barW / 3);
      ctx.beginPath();
      ctx.moveTo(barX, marginTop + plotH);
      ctx.lineTo(barX, barY + r);
      ctx.arcTo(barX, barY, barX + r, barY, r);
      ctx.lineTo(barX + barW - r, barY);
      ctx.arcTo(barX + barW, barY, barX + barW, barY + r, r);
      ctx.lineTo(barX + barW, marginTop + plotH);
      ctx.closePath();
      ctx.fill();
    }
  });

  // ── X axis: year labels at true linear positions ──
  ctx.fillStyle = '#888899';
  ctx.font = '12px "DM Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // Determine which years fall in range
  const firstYear = new Date(timeMin).getFullYear();
  const lastYear = new Date(timeMax).getFullYear();

  // Draw year labels
  for (let yr = firstYear; yr <= lastYear; yr++) {
    const t = new Date(yr, 0, 1).getTime();
    if (t < timeMin || t > timeMax) continue;
    const x = timeToX(t);
    // Year tick mark
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, marginTop + plotH);
    ctx.lineTo(x, marginTop + plotH + 8);
    ctx.stroke();
    ctx.fillStyle = '#ccc';
    ctx.font = 'bold 12px "DM Mono", monospace';
    ctx.fillText(yr.toString(), x, marginTop + plotH + 12);
  }

  // Draw month ticks (smaller) if space allows
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const totalMonths = buckets.length;
  const showMonthLabels = (plotW / totalMonths) > 22;

  if (showMonthLabels) {
    ctx.font = '9px "DM Mono", monospace';
    ctx.fillStyle = '#666';
    buckets.forEach(b => {
      const x = timeToX(b.timeMid);
      ctx.save();
      ctx.translate(x, marginTop + plotH + 30);
      ctx.rotate(-Math.PI / 4);
      ctx.textAlign = 'right';
      ctx.fillText(monthNames[b.month] + " '" + String(b.year).slice(2), 0, 0);
      ctx.restore();
    });
  }

  // X axis label
  ctx.fillStyle = '#aaa';
  ctx.font = '13px "Syne", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('Date (Linear Time Axis — each position corresponds to actual calendar date)', marginLeft + plotW / 2, H - 18);

  // ── Y axis labels ──
  ctx.fillStyle = '#888899';
  ctx.font = '11px "DM Mono", monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  yTicks.forEach(v => {
    ctx.fillText(v.toLocaleString(), marginLeft - 10, valToY(v));
  });

  // Y axis label (rotated)
  ctx.save();
  ctx.translate(16, marginTop + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#aaa';
  ctx.font = '13px "Syne", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Number of Comments per Month', 0, 0);
  ctx.restore();

  // ── Axes lines ──
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(marginLeft, marginTop);
  ctx.lineTo(marginLeft, marginTop + plotH);
  ctx.lineTo(W - marginRight, marginTop + plotH);
  ctx.stroke();

  // ── Summary stats in top-right ──
  const totalComments = dates.length;
  const peakBucket = buckets.reduce((a, b) => a.count > b.count ? a : b);
  const peakLabel = monthNames[peakBucket.month] + ' ' + peakBucket.year;

  ctx.fillStyle = '#666';
  ctx.font = '10px "DM Mono", monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText('Total: ' + totalComments.toLocaleString() + ' comments', W - marginRight, marginTop + 4);
  ctx.fillText('Peak: ' + peakBucket.count + ' in ' + peakLabel, W - marginRight, marginTop + 18);
  ctx.fillText('Range: ' + (firstYear) + ' — ' + (lastYear), W - marginRight, marginTop + 32);
}

// Add graph button to status bar after rendering
const _origRenderTable = renderTable;
renderTable = function(id) {
  _origRenderTable(id);
  const statusBar = document.getElementById('status-' + id);
  // Remove any existing graph button
  const existing = statusBar.querySelector('.graph-btn');
  if (existing) existing.remove();
  // Add graph button
  if (S[id].loaded && S[id].allRows.length) {
    const btn = document.createElement('button');
    btn.className = 'graph-btn';
    btn.innerHTML = '📊 Date Graph';
    btn.title = 'Show date distribution graph for this dataset';
    btn.onclick = openGraphModal;
    statusBar.appendChild(btn);
  }
};

// Handle window resize to redraw graph
window.addEventListener('resize', () => {
  if (document.getElementById('graph-modal-backdrop').classList.contains('open')) {
    const id = getActiveTabId();
    const s = S[id];
    if (!s.loaded || !s.allRows.length) return;
    const dates = [];
    s.allRows.forEach(row => {
      const raw = row['date_time'] || row['Date'] || row['date'] || '';
      if (!raw) return;
      const d = new Date(raw);
      if (!isNaN(d.getTime())) dates.push(d);
    });
    if (dates.length) drawGraph(dates, id);
  }
});

buildFolderBar();
